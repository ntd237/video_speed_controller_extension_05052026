<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Speed Controller</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="popup-container">
    <!-- Header -->
    <div class="header">
      <h1 class="header-title">Video Speed Controller</h1>
    </div>

    <!-- Speed Display Section -->
    <div class="section speed-section">
      <div class="speed-display" id="speedDisplay">1.00x</div>

      <div class="slider-container">
        <input
          type="range"
          id="speedSlider"
          class="slider"
          min="0.1"
          max="16"
          step="0.01"
          value="1.0"
        >
      </div>

      <div class="button-group">
        <button id="decreaseBtn" class="btn btn-secondary" title="Giảm tốc độ">−</button>
        <button id="resetBtn" class="btn btn-reset" title="Đặt lại 1x">1x</button>
        <button id="increaseBtn" class="btn btn-secondary" title="Tăng tốc độ">+</button>
      </div>
    </div>

    <!-- Step Size Section -->
    <div class="section">
      <label class="label">Bước nhảy:</label>
      <div class="step-size-row">
        <div class="step-presets" id="stepPresets"></div>
        <input
          type="number"
          id="stepSizeInput"
          class="input-number input-step"
          min="0.01"
          max="16"
          step="0.01"
          value="0.5"
        >
      </div>
    </div>

    <!-- Favorite Speed Section -->
    <div class="section">
      <div class="favorite-row">
        <label class="label label-inline">Yêu thích:</label>
        <input
          type="number"
          id="favoriteSpeedInput"
          class="input-favorite"
          placeholder="—"
          min="0.1"
          max="16"
          step="0.01"
        >
        <button id="saveFavoriteBtn" class="btn btn-secondary btn-save-fav">Lưu</button>
      </div>
      <div class="hint-text">Nhấn G để áp dụng</div>
    </div>

    <!-- Overlay Opacity Section -->
    <div class="section">
      <div class="opacity-row">
        <label class="label label-inline">Độ trong suốt:</label>
        <input type="range" id="overlayOpacitySlider" class="slider slider-small" min="0.1" max="1.0" step="0.05" value="0.7">
        <span id="overlayOpacityValue" class="opacity-display">0.70</span>
      </div>
    </div>

    <!-- Site Toggle Section -->
    <div class="section">
      <div class="toggle-row">
        <label for="siteToggle" class="label">
          <span id="siteToggleLabel">Bật trên trang này</span>
        </label>
        <label class="toggle-switch">
          <input type="checkbox" id="siteToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Settings Button -->
    <div class="section">
      <button id="settingsBtn" class="btn btn-primary btn-full">Cài đặt</button>
    </div>
  </div>

  <script src="../config/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
