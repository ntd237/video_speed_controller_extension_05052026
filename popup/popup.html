<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Speed Controller</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="popup.css">
  <script src="../config/defaults.js"></script>
  <script src="../config/ui.js"></script>
  <script src="../shared/theme.js"></script>
</head>
<body class="popup">
  <header class="p-header">
    <span class="p-brand">
      <span class="brand-tile brand-tile-sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="brandGradPopup" x1="4" y1="4" x2="21" y2="20" gradientUnits="userSpaceOnUse">
              <stop stop-color="#22E0FF"></stop>
              <stop offset="0.55" stop-color="#8B7BFF"></stop>
              <stop offset="1" stop-color="#E040FB"></stop>
            </linearGradient>
          </defs>
          <path d="m5 17 5-5-5-5" stroke="url(#brandGradPopup)" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="m12 17 5-5-5-5" stroke="url(#brandGradPopup)" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </span>
      <span class="p-brand-name">Video Speed</span>
    </span>

    <span class="p-site-state" id="siteState">
      <span class="state-dot" id="siteDot" data-state="saved" aria-hidden="true"></span>
      <span id="siteStateText">Đang bật</span>
    </span>
  </header>

  <main class="p-main">
    <section class="p-hero">
      <output class="hero-value" id="speedDisplay" for="speedSlider">1.00</output>
      <input type="range" class="slider p-slider" id="speedSlider" value="1"
        aria-label="Tốc độ phát video" aria-valuetext="1.00x">
      <div class="speed-actions">
        <button type="button" class="btn btn-ghost p-btn" id="decreaseBtn" title="Giảm tốc độ">
          <span aria-hidden="true">−</span><span class="visually-hidden">Giảm tốc độ</span>
        </button>
        <button type="button" class="btn btn-ghost p-btn p-reset" id="resetBtn"
          title="Quay về tốc độ mặc định">1x</button>
        <button type="button" class="btn btn-ghost p-btn" id="increaseBtn" title="Tăng tốc độ">
          <span aria-hidden="true">+</span><span class="visually-hidden">Tăng tốc độ</span>
        </button>
      </div>
    </section>

    <section class="p-section">
      <span class="micro-label" id="stepLabel">Bước nhảy</span>
      <div class="p-inline">
        <div class="presets" id="stepPresets" role="group" aria-labelledby="stepLabel"></div>
        <div class="num-field">
          <input type="number" id="stepSizeInput" value="0.50" aria-labelledby="stepLabel">
        </div>
      </div>
    </section>

    <section class="p-section">
      <div class="p-inline-label">
        <span class="micro-label" id="favLabel">Tốc độ yêu thích</span>
        <div class="num-field">
          <input type="number" id="favoriteSpeedInput" placeholder="Trống" aria-labelledby="favLabel">
        </div>
        <button type="button" class="btn btn-ghost p-save" id="saveFavoriteBtn">Lưu</button>
      </div>
      <p class="p-hint">Nhấn G để áp dụng.</p>
    </section>

    <section class="p-section">
      <div class="p-label-row">
        <span class="micro-label" id="opacityLabel">Độ trong suốt overlay</span>
        <span class="p-value" id="overlayOpacityValue">0.70</span>
      </div>
      <input type="range" class="slider p-slider" id="overlayOpacitySlider" value="0.7"
        aria-labelledby="opacityLabel" aria-valuetext="0.70">
    </section>

    <section class="p-section">
      <div class="p-toggle-row">
        <span class="p-toggle-label" id="siteToggleLabel">Bật trên trang này</span>
        <span class="switch">
          <input type="checkbox" id="siteToggle" checked aria-labelledby="siteToggleLabel">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </div>
    </section>
  </main>

  <footer class="p-footer">
    <button type="button" class="btn btn-primary p-open" id="settingsBtn">Mở cài đặt</button>
  </footer>

  <div class="toast-region p-toast" id="toastRegion" aria-live="polite"></div>

  <script src="../shared/ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
